[workspace]
resolver = "3"
members = ["crates/nb-protocol", "crates/nb-api", "crates/nb-domain", "crates/nb-render", "crates/nb-cli"]
default-members = ["crates/nb-protocol", "crates/nb-api", "crates/nb-domain", "crates/nb-render", "crates/nb-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[workspace.dependencies]
nb-protocol = { path = "crates/nb-protocol" }
nb-api = { path = "crates/nb-api" }
nb-domain = { path = "crates/nb-domain" }
incurs = { version = "0.14", features = ["http", "agent-plugins"] }
planus-translation = "1.3"
planus-types = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
half = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "multipart"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
secrecy = "0.10"
dirs = "6"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
hayro = "0.8"
hayro-write = "0.8"
nb-render = { path = "crates/nb-render" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
